name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Open extension popup
        2. Enter search or JQL query
        3. Observe issue...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension Version
      placeholder: "1.0.x"
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: Browser and Version
      placeholder: "Chrome 140.x"
    validations:
      required: true

  - type: input
    id: jira-host
    attributes:
      label: Jira Host
      description: Your Atlassian site host
      placeholder: "https://your-org.atlassian.net"

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Debug Diagnostics JSON
      description: Paste JSON generated from Report Issue modal if available.
      render: json

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Copy any relevant logs or errors.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues to avoid duplicates
          required: true
        - label: I included enough details to reproduce the issue
          required: true
