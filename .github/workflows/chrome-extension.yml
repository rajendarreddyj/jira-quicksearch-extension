name: Build, Version, and Publish Chrome Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-tag:
    name: Build, Bump Version, and Tag
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.update_version.outputs.new_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Get current version from manifest
        id: get_version
        run: |
          current_version=$(jq -r '.version' manifest.json)
          echo "Current version: $current_version"
          # Use Environment Files to set output
          echo "current_version=$current_version" >> $GITHUB_ENV

      - name: Update Semver version in manifest.json
        id: update_version
        run: |
          # Ensure no uncommitted changes before bumping
          git diff --exit-code

          # Read current version
          current_version="${{ env.current_version }}"

          # Update the version based on your release type (major, minor, patch)
          new_version=$(npm version patch --no-git-tag-version | sed 's/^v//')
          echo "Updated version: $new_version"

          # Update manifest.json with the new version
          jq --arg new_version "$new_version" '.version=$new_version' manifest.json > temp.json && mv temp.json manifest.json

          # Set new version using Environment Files
          echo "new_version=$new_version" >> $GITHUB_ENV
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Commit updated manifest.json
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git add manifest.json package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "Bump version to ${{ env.new_version }}"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Create and push release tag
        run: |
          git tag v${{ env.new_version }}
          git push origin v${{ env.new_version }}

  publish-to-chrome-web-store:
    name: Publish to Chrome Web Store & GitHub Release
    needs: build-and-tag
    if: github.ref == 'refs/heads/main' && needs.build-and-tag.result == 'success'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v${{ needs.build-and-tag.outputs.new_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome extension
        run: npm run build

      - name: Create extension package zip
        run: |
          TAG="${RELEASE_TAG}"
          cd dist
          zip -r "../jira-quicksearch-${TAG}.zip" .

      - name: Upload extension artifact with version
        uses: actions/upload-artifact@v7
        with:
          name: jira-quicksearch-${{ env.RELEASE_TAG }}
          path: jira-quicksearch-${{ env.RELEASE_TAG }}.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          files: jira-quicksearch-${{ env.RELEASE_TAG }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload & Publish to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXT_ZIP: jira-quicksearch-${{ env.RELEASE_TAG }}.zip
        run: |
          set -euo pipefail

          echo "Requesting Google OAuth access token..."
          TOKEN_RESPONSE=$(curl -sS -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=${CHROME_CLIENT_ID}" \
            -d "client_secret=${CHROME_CLIENT_SECRET}" \
            -d "refresh_token=${CHROME_REFRESH_TOKEN}" \
            -d "grant_type=refresh_token")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')
          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "Failed to get access token"
            echo "$TOKEN_RESPONSE"
            exit 1
          fi

          echo "Uploading extension package to Chrome Web Store..."
          UPLOAD_RESPONSE=$(curl -sS -X PUT \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Type: application/zip" \
            --data-binary "@${EXT_ZIP}" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${CHROME_EXTENSION_ID}")

          echo "Upload response: $UPLOAD_RESPONSE"
          UPLOAD_OK=$(echo "$UPLOAD_RESPONSE" | jq -r '.uploadState == "SUCCESS"')
          if [ "$UPLOAD_OK" != "true" ]; then
            echo "Chrome Web Store upload failed"
            exit 1
          fi

          echo "Publishing extension..."
          PUBLISH_RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${CHROME_EXTENSION_ID}/publish")

          echo "Publish response: $PUBLISH_RESPONSE"
