name: Build, Version, and Publish Chrome Extension

on:
  push:
    branches:
      - main  # Change this to your default branch if different

jobs:
  build-and-test:
    name: Build & Validate Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Get current version from manifest
        id: get_version
        run: |
          current_version=$(jq -r '.version' manifest.json)
          echo "Current version: $current_version"
          # Use Environment Files to set output
          echo "current_version=$current_version" >> $GITHUB_ENV

      - name: Update Semver version in manifest.json
        id: update_version
        run: |
          # Ensure no uncommitted changes before bumping
          git diff --exit-code

          # Read current version
          current_version="${{ env.current_version }}"

          # Update the version based on your release type (major, minor, patch)
          new_version=$(npm version patch --no-git-tag-version | sed 's/^v//')
          echo "Updated version: $new_version"

          # Update manifest.json with the new version
          jq --arg new_version "$new_version" '.version=$new_version' manifest.json > temp.json && mv temp.json manifest.json

          # Set new version using Environment Files
          echo "new_version=$new_version" >> $GITHUB_ENV

      - name: Commit updated manifest.json
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git add manifest.json
          git add package.json
          git add package-lock.json
          git commit -m "Bump version to ${{ env.new_version }}"
          git push

      - name: Push tags
        run: |
          git tag v${{ env.new_version }}
          git push --tags

      - name: Install dependencies
        run: |
          npm ci  # Adjust if you have specific dependencies  - future

      - name: Lint Codebase
        run: npm run lint || true

      - name: Build Chrome extension
        run: npm run build  # Adjust this command based on your build setup - future

      - name: Zip the extension (excluding .github folder)
        run: |
          new_version=${{ env.new_version }}
          zip -r "extension-${new_version}.zip" * -x ".github/*"  # Exclude .github folder

      - name: Upload extension artifact with version
        uses: actions/upload-artifact@v4
        with:
          name: "jira-search-chrome-extension-${{ env.new_version }}"
          path: "extension-${{ env.new_version }}.zip"

      # Optional: Publish the extension to the Chrome Web Store
      # Uncomment and configure if needed
      # - name: Publish to Chrome Web Store
      #   uses: your-action-to-publish
      #   with:
      #     api_key: ${{ secrets.CHROME_API_KEY }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.new_version }}
          name: "Release v${{ env.new_version }}"
          body: |
            Updated Chrome extension to version ${{ env.new_version }}.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish-to-chrome-web-store:
    name: Publish to Chrome Web Store & GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: jira-search-chrome-extension-${{ env.new_version }}
          path: build-artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build-artifact/extension-${{ env.new_version }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload & Publish to Chrome Web Store
        uses: chrome-stats/jira-search-chrome-extension-upload@v2
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          file-path: build-artifact/extension-${{ env.new_version }}.zip
          publish: true
