name: Build, Version, and Publish Chrome Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-tag:
    name: Build, Bump Version, and Tag
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Get current version from manifest
        id: get_version
        run: |
          current_version=$(jq -r '.version' manifest.json)
          echo "Current version: $current_version"
          # Use Environment Files to set output
          echo "current_version=$current_version" >> $GITHUB_ENV

      - name: Update Semver version in manifest.json
        id: update_version
        run: |
          # Ensure no uncommitted changes before bumping
          git diff --exit-code

          # Read current version
          current_version="${{ env.current_version }}"

          # Update the version based on your release type (major, minor, patch)
          new_version=$(npm version patch --no-git-tag-version | sed 's/^v//')
          echo "Updated version: $new_version"

          # Update manifest.json with the new version
          jq --arg new_version "$new_version" '.version=$new_version' manifest.json > temp.json && mv temp.json manifest.json

          # Set new version using Environment Files
          echo "new_version=$new_version" >> $GITHUB_ENV

      - name: Commit updated manifest.json
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git add manifest.json package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "Bump version to ${{ env.new_version }}"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Create and push release tag
        run: |
          git tag v${{ env.new_version }}
          git push origin v${{ env.new_version }}

  publish-to-chrome-web-store:
    name: Publish to Chrome Web Store & GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome extension
        run: npm run build

      - name: Create extension package zip
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd dist
          zip -r "../jira-search-chrome-extension-${TAG}.zip" .

      - name: Upload extension artifact with version
        uses: actions/upload-artifact@v7
        with:
          name: jira-search-chrome-extension-${{ github.ref_name }}
          path: jira-search-chrome-extension-${{ github.ref_name }}.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: jira-search-chrome-extension-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload & Publish to Chrome Web Store
        uses: chrome-stats/chrome-extension-upload@v2
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          file-path: jira-search-chrome-extension-${{ github.ref_name }}.zip
          publish: true
