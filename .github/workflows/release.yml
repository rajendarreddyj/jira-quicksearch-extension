name: Build & Publish Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web & Extension Assets
        run: npm run build

      - name: Create Extension Package Zip
        run: |
          mkdir -p release-build
          cp -r dist/* release-build/
          cd release-build
          zip -r ../jira-search-chrome-extension-${{ github.ref_name }}.zip .

      - name: Create GitHub Release & Upload Package
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: jira-search-chrome-extension-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
